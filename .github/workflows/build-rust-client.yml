name: Build NikitaVPNClient

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/build-rust-client.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/build-rust-client.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-x86_64
            binary: target/release/nikitavpnclient
            xray_asset: Xray-linux-64.zip
            xray_executable: xray
            tun2socks_asset: tun2socks-linux-amd64.zip
            tun2socks_executable: tun2socks
          - os: windows-2025
            suffix: windows-x86_64
            binary: target/release/nikitavpnclient.exe
            xray_asset: Xray-windows-64.zip
            xray_executable: xray.exe
            tun2socks_asset: tun2socks-windows-amd64.zip
            tun2socks_executable: tun2socks.exe
          - os: macos-15
            suffix: macos-arm64
            binary: target/release/nikitavpnclient
            xray_asset: Xray-macos-arm64-v8a.zip
            xray_executable: xray
            tun2socks_asset: tun2socks-darwin-arm64.zip
            tun2socks_executable: tun2socks
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: rustc --version && cargo --version
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxfixes-dev
      - name: Download official Xray-core release
        shell: bash
        run: |
          mkdir -p build-assets
          curl --fail --location --silent --show-error \
            "https://github.com/XTLS/Xray-core/releases/latest/download/${{ matrix.xray_asset }}" \
            --output build-assets/xray-release.zip
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          executable = os.environ["XRAY_EXECUTABLE"]
          bundled = {executable: "INCY_XRAY_BINARY", "geoip.dat": "INCY_GEOIP_BINARY", "geosite.dat": "INCY_GEOSITE_BINARY"}
          with ZipFile("build-assets/xray-release.zip") as archive:
              for filename, variable in bundled.items():
                  matches = [item for item in archive.infolist() if Path(item.filename).name == filename]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected one {filename} in the official release archive; got {len(matches)}")
                  destination = Path("build-assets") / filename
                  destination.write_bytes(archive.read(matches[0]))
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write(f"{variable}={destination.resolve()}\n")
          PY
        env:
          XRAY_EXECUTABLE: ${{ matrix.xray_executable }}
      - name: Bundle tun2socks userspace TUN engine
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/xjasonlyu/tun2socks/releases/latest/download/${{ matrix.tun2socks_asset }}" \
            --output build-assets/tun2socks.zip
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          expected = os.environ["TUN2SOCKS_EXECUTABLE"]
          with ZipFile("build-assets/tun2socks.zip") as archive:
              matches = [item for item in archive.infolist() if Path(item.filename).name.lower() in {"tun2socks", "tun2socks.exe"}]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one tun2socks executable in release archive; got {[item.filename for item in archive.infolist()]}")
              destination = Path("build-assets") / expected
              destination.write_bytes(archive.read(matches[0]))
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write(f"INCY_TUN2SOCKS_BINARY={destination.resolve()}\n")
          PY
        env:
          TUN2SOCKS_EXECUTABLE: ${{ matrix.tun2socks_executable }}
      # CI resolves upstream eframe's optional (unused glow) dependencies too;
      # the offline dev vendor omits them, so refresh the lockfile here.
      - run: cargo generate-lockfile
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p nikitavpnclient
      - uses: actions/upload-artifact@v4
        with:
          name: nikitavpnclient-${{ matrix.suffix }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
