name: Build NikitaVPNClient

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/build-rust-client.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/build-rust-client.yml'

permissions:
  contents: read

jobs:
  build:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-x86_64
            binary: target/release/nikitavpnclient
          - os: windows-2025
            suffix: windows-x86_64
            binary: target/release/nikitavpnclient.exe
          - os: macos-15
            suffix: macos-arm64
            binary: target/release/nikitavpnclient
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxfixes-dev
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p nikitavpnclient
      - uses: actions/upload-artifact@v4
        with:
          name: nikitavpnclient-${{ matrix.suffix }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
